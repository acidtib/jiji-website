name: Deploy site to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

  # Fired by acidtib/jiji's release workflow after a new version is published, so the version
  # badge on the landing page stays current without the two repos needing to be updated in
  # lockstep by hand. client_payload.version is optional -- if absent (or this run wasn't
  # triggered by dispatch), the build step below falls back to querying the latest release.
  repository_dispatch:
    types: [jiji-release]

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Resolve jiji version
        id: jiji_version
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            version="$DISPATCH_VERSION"
          else
            version=$(gh api repos/acidtib/jiji/releases/latest --jq .tag_name)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build with Next.js
        env:
          NEXT_PUBLIC_JIJI_VERSION: ${{ steps.jiji_version.outputs.version }}
        run: bun run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  # Deployment job
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
