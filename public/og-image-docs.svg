<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#1F2317" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="760" y1="80" x2="1120" y2="550" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A3E635" stop-opacity=".16"/>
      <stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#09090B"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".5"/>
  <rect x="1" y="1" width="1198" height="628" stroke="#2A2E22" stroke-width="2"/>
  <circle cx="1000" cy="154" r="320" fill="url(#glow)"/>

  <image href="jiji_logo.svg" x="64" y="50" width="182" height="55"/>

  <g transform="translate(1004 63)">
    <rect width="132" height="42" rx="21" fill="#14150F" stroke="#33391F"/>
    <circle cx="24" cy="21" r="5" fill="#A3E635"/>
    <text x="42" y="27" fill="#C9CFC0" font-family="monospace" font-size="15" letter-spacing="1.5">DOCS</text>
  </g>

  <text x="64" y="238" fill="#F5F6F2" font-family="Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-3">
    Everything you
  </text>
  <text x="64" y="315" fill="#F5F6F2" font-family="Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-3">
    need to deploy
  </text>
  <text x="64" y="392" fill="#A3E635" font-family="Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-3">
    anywhere.
  </text>
  <text x="68" y="440" fill="#B2B8A9" font-family="Arial, sans-serif" font-size="22">
    Install, configure, and deploy Jiji across your own servers.
  </text>

  <g transform="translate(760 175)">
    <rect width="376" height="298" rx="8" fill="#0D0F0A" stroke="#33391F"/>
    <rect width="376" height="48" rx="8" fill="#15170F"/>
    <path d="M0 48H376" stroke="#33391F"/>
    <circle cx="24" cy="24" r="5" fill="#A3E635"/>
    <circle cx="43" cy="24" r="5" fill="#4C5140"/>
    <circle cx="62" cy="24" r="5" fill="#4C5140"/>
    <text x="352" y="29" fill="#82897A" font-family="monospace" font-size="12" text-anchor="end">GETTING STARTED</text>

    <text x="25" y="88" fill="#82897A" font-family="monospace" font-size="13">$</text>
    <text x="41" y="88" fill="#F1F4EE" font-family="monospace" font-size="13">curl -fsSL get.jiji.run/install.sh | sh</text>

    <circle cx="31" cy="128" r="8" fill="#A3E635"/>
    <path d="M27 128L30 131L35 125" stroke="#0D1206" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="133" fill="#C9CFC0" font-family="monospace" font-size="14">Install the CLI</text>

    <circle cx="31" cy="169" r="8" fill="#A3E635"/>
    <path d="M27 169L30 172L35 166" stroke="#0D1206" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="174" fill="#C9CFC0" font-family="monospace" font-size="14">Configure your servers</text>

    <circle cx="31" cy="210" r="8" fill="#A3E635"/>
    <path d="M27 210L30 213L35 207" stroke="#0D1206" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="215" fill="#C9CFC0" font-family="monospace" font-size="14">jiji deploy</text>

    <rect x="24" y="246" width="328" height="30" rx="4" fill="#1B2410"/>
    <text x="188" y="266" fill="#C3F53C" font-family="monospace" font-size="13" text-anchor="middle">READ THE DOCS</text>
  </g>

  <path d="M64 526H1136" stroke="#2A2E22"/>
  <circle cx="72" cy="566" r="5" fill="#A3E635"/>
  <text x="90" y="573" fill="#B2B8A9" font-family="monospace" font-size="18">JIJI.RUN/DOCS</text>
  <text x="1136" y="573" fill="#B2B8A9" font-family="monospace" font-size="18" text-anchor="end">INSTALL · CONFIGURE · DEPLOY · MONITOR</text>
</svg>
